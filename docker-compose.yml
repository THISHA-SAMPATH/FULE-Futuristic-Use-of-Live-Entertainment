services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fule
      POSTGRES_USER: fule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes: [fule-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fule -d fule"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [fule-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      DEMO_MODE: ${DEMO_MODE:-true}
      PORT: 4000
      DATABASE_URL: postgres://fule:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/fule
      REDIS_URL: redis://redis:6379
      FRONTEND_ORIGIN: http://localhost:4173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the root .env file}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in the root .env file}
      INCIDENT_RETENTION_DAYS: ${INCIDENT_RETENTION_DAYS:-90}
      FULE_DEMO_GUARDIAN_INVITE: ${FULE_DEMO_GUARDIAN_INVITE:?Set FULE_DEMO_GUARDIAN_INVITE in the root .env file}
      FULE_LOAD_TEST_TOKEN: ${FULE_LOAD_TEST_TOKEN:-}
      FULE_SOS_IP_LIMIT: ${FULE_SOS_IP_LIMIT:-6}
      FULE_API_IP_LIMIT: ${FULE_API_IP_LIMIT:-180}
      TWITCH_INTEGRATION_ENABLED: ${TWITCH_INTEGRATION_ENABLED:-false}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI:-http://localhost:4000/auth/twitch/callback}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-180}
      LIVEKIT_MAX_PARTICIPANTS: ${LIVEKIT_MAX_PARTICIPANTS:-12}
      LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL:-}
      LIVEKIT_EGRESS_S3_BUCKET: ${LIVEKIT_EGRESS_S3_BUCKET:-}
      LIVEKIT_EGRESS_PREFIX: ${LIVEKIT_EGRESS_PREFIX:-fule-evidence}
      LIVEKIT_RECORDING_RETENTION_DAYS: ${LIVEKIT_RECORDING_RETENTION_DAYS:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      SAFE_WALK_PIN_PEPPER: ${SAFE_WALK_PIN_PEPPER:?Set SAFE_WALK_PIN_PEPPER in the root .env file}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:security@fule.app}
      NEARBY_GUARDIAN_RADIUS_METERS: ${NEARBY_GUARDIAN_RADIUS_METERS:-400}
      NEARBY_GUARDIAN_OFFER_LIMIT: ${NEARBY_GUARDIAN_OFFER_LIMIT:-10}
      NEARBY_GUARDIAN_ACCEPT_CAP: ${NEARBY_GUARDIAN_ACCEPT_CAP:-5}
      EVIDENCE_STORAGE_DIR: /app/backend/data/evidence
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:-}
    ports: ["4000:4000"]
    volumes: [fule-evidence:/app/backend/data/evidence]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
        VITE_DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["4173:80"]
    depends_on: [backend]
volumes:
  fule-postgres:
  fule-redis:
  fule-evidence:
